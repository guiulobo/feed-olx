[tool.pytest.ini_options]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
# O corretor e os testes de sigilo já publicados ficam de fora.
# Esta rodada não mexe na regra de negócio deles.
extend-exclude = [
  "corrige_feed.py",
  "test_lista_sigilo.py",
  "test_endereco_completo_lista_vazia.py",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
branch = true
source = ["orquestra_feed"]

[tool.coverage.report]
fail_under = 95
show_missing = true
