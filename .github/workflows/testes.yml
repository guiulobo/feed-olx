name: Testes

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4

      - name: Prepara o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala as ferramentas de teste
        run: python -m pip install --disable-pip-version-check 'pytest==9.2.0' 'pytest-cov==7.1.0' 'ruff==0.17.5'

      - name: Ruff
        run: python -m ruff check . && python -m ruff format --check .

      - name: Pytest
        run: python -m pytest --cov=orquestra_feed --cov-branch --cov-report=term-missing --cov-fail-under=95
