name: Atualiza feeds OLX (2x ao dia)

on:
  schedule:
    - cron: '0 8 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: atualiza-feed
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4

      - name: Prepara o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Uma conta com falha não impede a outra. O script publica quem
      # passou, preserva o XML bom de quem falhou, avisa numa issue só
      # e termina com erro se alguma conta falhou.
      - name: Baixa, corrige e publica as duas contas
        env:
          PYTHONUNBUFFERED: '1'
          VISTA_FEED_URL: ${{ secrets.VISTA_FEED_URL }}
          VISTA_FEED_URL_LOBO: ${{ secrets.VISTA_FEED_URL_LOBO }}
          PORTAIS_LISTA_SIGILO: ${{ secrets.PORTAIS_LISTA_SIGILO }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 orquestra_feed.py
